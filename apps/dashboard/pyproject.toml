[project]
name = "dashboard"
version = "0.0.0"
description = "Agents Dashboard — suivi des agents, tokens et sprint"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

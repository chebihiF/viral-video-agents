<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connexion — Agents Dashboard</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: var(--font-size-body); }
    main { background: var(--color-surface); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); padding: var(--space-6); width: min(100% - var(--space-6), 360px); box-sizing: border-box; }
    h1 { font-size: var(--font-size-title); margin: 0 0 var(--space-5); }
    form { display: grid; gap: var(--space-3); }
    label { font-size: var(--font-size-label); color: var(--color-text-muted); }
    input { min-height: 36px; padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); font: inherit; }
    button { min-height: 36px; border: 0; border-radius: var(--radius-md); background: var(--color-accent); color: var(--color-on-accent); font: inherit; font-weight: 600; cursor: pointer; }
    [role="alert"] { margin: 0 0 var(--space-4); padding: var(--space-3); border-radius: var(--radius-sm); background: var(--color-danger-bg); color: var(--color-danger); }
  </style>
</head>
<body>
  <main>
    <h1>Agents Dashboard</h1>
    {% if message %}<p role="alert">{{ message }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>

{#- État vide commun (#98) : icône, titre, une phrase, une action (corps du `call`).
    Usage : {% call empty("Titre", "Explication.") %}Action suivante{% endcall %} -#}
{% macro empty(title, text, id="empty-title") %}
<section class="state" aria-labelledby="{{ id }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5.5 5h13L21 13v6H3v-6z"></path></svg>
  <h2 id="{{ id }}">{{ title }}</h2>
  <p>{{ text }}</p>
  <p class="state-action">{{ caller() }}</p>
</section>
{% endmacro %}

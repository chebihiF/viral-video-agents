<style>
  .live-rows { list-style: none; margin: 0; padding: 0; display: grid; }
  .live-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2); padding: var(--space-3) 0; min-height: 36px; border-bottom: 1px solid var(--color-border-subtle); font-size: var(--font-size-body); }
  .live-row:last-child { border-bottom: 0; }
  .live-row strong { font-weight: 600; }
  .live-state { font-weight: 600; padding: 0 var(--space-2); border-radius: var(--radius-pill); }
  .live-state::before { margin-right: var(--space-1); }
  .live-state--actif { color: var(--color-ok); background: var(--color-ok-bg); }
  .live-state--actif::before { content: "●"; }
  .live-state--en-attente { color: var(--color-warn); background: var(--color-warn-bg); }
  .live-state--en-attente::before { content: "○"; }
  .live-state--terminé { color: var(--color-text-muted); }
  .live-state--terminé::before { content: "✓"; }
  .live-last { margin-left: auto; font-size: var(--font-size-small); }
</style>
<section class="panel" aria-labelledby="live-title">
  <h2 id="live-title">Qui fait quoi</h2>
  <ul class="live-rows">
    {% for r in live_rows %}
    <li class="live-row">
      <strong>{{ r.agent }}</strong> ·
      <span>{% if r.ticket is none %}ticket inconnu{% else %}ticket #{{ r.ticket }}{% endif %}</span> ·
      <span class="live-state live-state--{{ r.state | replace(' ', '-') }}">{{ r.state }}</span> ·
      <span>{{ r.duration }}</span>
      <span class="live-last muted">dernier événement à <time>{{ r.last_label }}</time> UTC</span>
    </li>
    {% endfor %}
  </ul>
</section>

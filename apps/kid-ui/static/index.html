<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimo</title>
<meta name="theme-color" content="#120E2B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/mimo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/tokens-enfant.css">
<link rel="stylesheet" href="/shell.css">
<!-- Coquille statique, aucune ressource externe. Thème : theme.js pose data-theme sur <html> avant le rendu ; shell.js (SW, hors ligne) en fin de page. -->
</head>
<body style="margin:0">

<!-- ===== Écran 1 : Accueil ===== -->
<section class="kid-screen" id="ecran-accueil" aria-labelledby="h-accueil">
  <header class="kid-bar">
    <h1 id="h-accueil">Mimo</h1>
    <a class="kid-icon-btn" href="#mes-videos" aria-label="Mes vidéos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
    </a>
  </header>

  <main class="kid-log" style="gap:12px">
    <div class="hero">
      <svg class="mimo xl bob" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 28 L12 6 L28 16 Z" fill="#FF8A1F" stroke="#1B1340" stroke-width="3" stroke-linejoin="round"/>
        <path d="M54 28 L52 6 L36 16 Z" fill="#FF8A1F" stroke="#1B1340" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="32" cy="36" rx="25" ry="21" fill="#FF8A1F" stroke="#1B1340" stroke-width="3"/>
        <ellipse cx="32" cy="43" rx="10" ry="7" fill="#FFE3C2"/>
        <g class="eyes"><ellipse cx="22" cy="34" rx="3.6" ry="4.6" fill="#1B1340"/><ellipse cx="42" cy="34" rx="3.6" ry="4.6" fill="#1B1340"/></g>
        <path d="M29.5 40 L34.5 40 L32 43 Z" fill="#FF5C8A" stroke="#1B1340" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M32 43 Q32 47 28 47 M32 43 Q32 47 36 47" fill="none" stroke="#1B1340" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h2>On fait une <mark>vidéo</mark> ?</h2>
    </div>

    <!-- Idées de départ : libellés fixes de l'appli, jamais le texte de l'enfant -->
    <ul class="starters">
      <li><button type="button" class="kid-btn" data-idee="Une histoire"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.4 6.6 19.5l1.2-6L3.300 9.300l6.100-.7z"/></svg></span>Une histoire</button></li>
      <li><button type="button" class="kid-btn" data-idee="Une blague"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.500h.01M15 9.500h.01"/></svg></span>Une blague</button></li>
      <li><button type="button" class="kid-btn" data-idee="Mon idée"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg></span>Mon idée</button></li>
    </ul>

    <div class="kid-theme" role="radiogroup" aria-label="Couleurs">
      <span>Couleurs</span>
      <button type="button" role="radio" aria-checked="true"><i class="t-nuit"></i>Nuit</button>
      <button type="button" role="radio" aria-checked="false"><i class="t-soleil"></i>Soleil</button>
      <button type="button" role="radio" aria-checked="false"><i class="t-menthe"></i>Menthe</button>
    </div>
  </main>

  <form class="kid-composer">
    <label class="sr-only" for="idee">Ton idée</label>
    <textarea id="idee" name="idee" rows="1" placeholder="Dis-moi ton idée"></textarea>
    <button type="button" class="kid-btn pop round" aria-label="Parler">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </button>
    <button type="submit" class="kid-btn primary round" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="dir" d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</section>

<!-- ===== Écran 8 : Erreur (hors ligne) ===== -->
<section class="kid-screen" id="ecran-erreur" aria-labelledby="h-erreur" hidden>
  <header class="kid-bar">
    <h1 id="h-erreur">Mimo</h1>
    <a class="kid-icon-btn" href="#ecran-accueil" aria-label="Accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>
    </a>
  </header>

  <main class="kid-log" style="justify-content:center">
    <div class="scene">
      <svg class="mimo xl dizzy" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 28 L12 6 L28 16 Z" fill="#FF8A1F" stroke="#1B1340" stroke-width="3" stroke-linejoin="round"/>
        <path d="M54 28 L52 6 L36 16 Z" fill="#FF8A1F" stroke="#1B1340" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="32" cy="36" rx="25" ry="21" fill="#FF8A1F" stroke="#1B1340" stroke-width="3"/>
        <ellipse cx="32" cy="43" rx="10" ry="7" fill="#FFE3C2"/>
        <path d="M18 30l8 8M26 30l-8 8M38 30l8 8M46 30l-8 8" stroke="#1B1340" stroke-width="3" stroke-linecap="round"/>
        <path d="M27 47 Q32 43 37 47" fill="none" stroke="#1B1340" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="note bad" role="alert">
      <h2>Oups, pas de connexion</h2>
      <p>Mimo n'arrive pas à te répondre pour l'instant. Réessaie dans un moment.</p>
      <span class="kid-chip bad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>Hors ligne</span>
    </div>
  </main>

  <div class="kid-cta">
    <button type="button" class="kid-btn primary lg">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.400-5.700M20 4v5h-5"/></svg>
      Réessayer
    </button>
  </div>
</section>

<script src="/status.js"></script>
<script src="/player.js"></script>
<script src="/shell.js"></script>
<script src="/dictation.js"></script>
<script src="/accueil.js"></script>
</body>
</html>

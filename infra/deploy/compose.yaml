# Dashboard en prod sur le VPS, derrière le reverse proxy existant (Traefik de n8n).
# Variables fournies par deploy.sh et /opt/vva/proxy.env (propre au VPS, hors dépôt).
name: vva
# Blue/green (#25) : deux services identiques, un seul actif en régime normal ; deploy.sh démarre
# le slot inactif, vérifie qu'il est sain, puis arrête l'ancien. Même routeur et même service Traefik
# (vva-dashboard) : Traefik répartit sur les conteneurs sains, donc aucune coupure pendant la bascule.
# LABELS : routeur et middleware portent le nom du slot (vva-dashboard-blue / -green) : ainsi deux
# versions (ou l'ancien conteneur unique « vva-dashboard ») ne peuvent jamais définir le même routeur
# de façon différente (Traefik ignorerait alors le routeur : 404, constaté au premier déploiement).
# Le SERVICE vva-dashboard, lui, doit rester strictement identique partout (même port).
# Migrations de base : additives uniquement (les deux versions tournent en même temps sur /data).
x-dashboard: &dashboard
    image: ${IMAGE}:${IMAGE_TAG:-unused}
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Jeton généré par deploy.sh dans /opt/vva/ingest_token (hors dépôt) ; absent => l'ingestion répond 503.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Posés par deploy.sh (/opt/vva/session_key, /opt/vva/dashboard_password_hash) ; hash absent => /login répond 503.
      DASHBOARD_SESSION_KEY: ${DASHBOARD_SESSION_KEY:-}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      VVA_DB_PATH: /data/vva.db
    volumes:
      - vva-data:/data
    mem_limit: 256m
    cpus: 0.5
    networks: [proxy]
services:
  dashboard_blue:
    <<: *dashboard
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.vva-dashboard-blue.rule=Host(`${DASHBOARD_HOST}`)
      - traefik.http.routers.vva-dashboard-blue.entrypoints=${TLS_ENTRYPOINT}
      - traefik.http.routers.vva-dashboard-blue.tls=true
      - traefik.http.routers.vva-dashboard-blue.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.vva-dashboard-blue.middlewares=vva-retry-blue
      - traefik.http.middlewares.vva-retry-blue.retry.attempts=3
      - traefik.http.routers.vva-dashboard-blue.service=vva-dashboard
      - traefik.http.services.vva-dashboard.loadbalancer.server.port=8000
  dashboard_green:
    <<: *dashboard
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.vva-dashboard-green.rule=Host(`${DASHBOARD_HOST}`)
      - traefik.http.routers.vva-dashboard-green.entrypoints=${TLS_ENTRYPOINT}
      - traefik.http.routers.vva-dashboard-green.tls=true
      - traefik.http.routers.vva-dashboard-green.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.vva-dashboard-green.middlewares=vva-retry-green
      - traefik.http.middlewares.vva-retry-green.retry.attempts=3
      - traefik.http.routers.vva-dashboard-green.service=vva-dashboard
      - traefik.http.services.vva-dashboard.loadbalancer.server.port=8000
volumes:
  vva-data:
networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true

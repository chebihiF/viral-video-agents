name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vva-dashboard

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        name: Version SemVer (Conventional Commits)
        run: |
          next=$(python3 infra/scripts/next_version.py)
          if [ -n "$next" ]; then
            git tag "v$next" && git push origin "v$next"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          else
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            echo "version=${last#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, image]
    runs-on: [self-hosted, vps-deploy]
    environment:
      name: production
      url: https://dashboard.srv1241648.hstgr.cloud
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/deploy
      - name: Connexion GHCR (jeton éphémère du job)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Déploiement + smoke test + rollback automatique
        run: infra/deploy/deploy.sh "${{ env.IMAGE }}" "${{ needs.version.outputs.version }}"
      - name: Déconnexion GHCR
        if: always()
        run: docker logout ghcr.io

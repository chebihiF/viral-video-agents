name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::Titre de PR non conforme aux Conventional Commits : $TITLE"; exit 1; }

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: ffmpeg (tests media-service)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ruff
        run: uv run ruff check --output-format=github . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest
      - name: docs/MAP.md à jour
        run: python3 infra/scripts/gen_map.py --check

  b-sans-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: contrats et garde-fou fichiers Claude
        run: uv run pytest tests/contracts infra/scripts/test_no_claude_tracked.py
      - name: evals --dry-run (sans réseau ni GPU)
        run: |
          uv run python evals/classification_eval.py --dry-run
          uv run python evals/storyboard_eval.py --dry-run

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-hashes --no-emit-workspace -o req.txt
      - run: uvx pip-audit -r req.txt --progress-spinner off

  ci-ok:
    if: always()
    needs: [pr-title, quality, b-sans-gpu, gitleaks, audit]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]

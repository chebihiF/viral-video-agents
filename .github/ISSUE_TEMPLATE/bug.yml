name: Bug
description: Comportement incorrect
title: "Bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Constaté (avec logs / version de /healthz)
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Attendu
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
    validations: { required: true }
  - type: textarea
    id: files
    attributes:
      label: Fichiers suspectés

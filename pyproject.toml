[project]
name = "viral-video-agents"
version = "0.0.0"
description = "Monorepo — appli familiale de vidéos animées générées par IA open source"
requires-python = ">=3.12"

[project.optional-dependencies]
# ASR local de la dictée (#217) : `uv sync --extra asr` ; absent de la CI (tests avec faux module)
asr = ["faster-whisper>=1.1"]

[tool.uv.workspace]
members = ["apps/media-service", "apps/orchestrator"]

[tool.uv.sources]
media-service = { workspace = true }
orchestrator = { workspace = true }

[dependency-groups]
dev = [
  "media-service",
  "orchestrator[media]",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
  "pip-audit>=2.7",
  "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "workflows"]

[tool.ruff.format]
# Scripts GPU/évals encore édités sur le PC : formatage différé
exclude = ["apps/gpu-worker/*", "evals/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["media_service", "orchestrator"]

[tool.ruff.lint.per-file-ignores]
"apps/gpu-worker/*" = ["S310", "S110", "E501"]
"evals/*" = ["S310", "T201", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/media-service/src", "apps/orchestrator/src", "infra/scripts", "evals/classification_eval.py", "evals/test_classification_eval.py",
  "apps/kid-ui/server.py", "apps/kid-ui/transcriber.py", "apps/kid-ui/jobs.py", "apps/kid-ui/make_icons.py",
  "apps/gpu-worker/worker.py", "apps/gpu-worker/comfy_run.py", "apps/gpu-worker/lan_guard.py", "apps/gpu-worker/gpu_power.py"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts", "apps/media-service/tests", "apps/orchestrator/tests", "infra/scripts", "evals", "apps/gpu-worker/tests", "apps/kid-ui/tests", "infra/kid-ui/tests", "infra/vpn/tests"]
pythonpath = ["infra/scripts", "evals", "apps/gpu-worker", "apps/kid-ui", "infra/vpn"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["e2e: parcours de bout en bout avec mocks (ffmpeg local, sans GPU ni réseau)"]
addopts = "-q --no-header -p no:cacheprovider"

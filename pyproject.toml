[project]
name = "viral-video-agents"
version = "0.0.0"
description = "Monorepo — appli familiale de vidéos animées générées par IA open source"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/dashboard", "apps/media-service"]

[tool.uv.sources]
dashboard = { workspace = true }
media-service = { workspace = true }

[dependency-groups]
dev = [
  "dashboard",
  "media-service",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
  "pip-audit>=2.7",
  "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "workflows"]

[tool.ruff.format]
# Scripts GPU/évals encore édités sur le PC : formatage différé
exclude = ["apps/gpu-worker/*", "evals/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard", "media_service", "next_version", "hook_emit", "ship"]

[tool.ruff.lint.per-file-ignores]
"apps/gpu-worker/*" = ["S310", "S110", "E501"]
"evals/*" = ["S310", "T201", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/dashboard/src", "apps/media-service/src", "infra/scripts", "tools/telemetry"]

[tool.pytest.ini_options]
testpaths = ["apps/dashboard/tests", "apps/media-service/tests", "infra/scripts", "tools/telemetry/tests"]
pythonpath = ["infra/scripts", "tools/telemetry"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --no-header -p no:cacheprovider"
